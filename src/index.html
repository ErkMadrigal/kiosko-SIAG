<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ionic App</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>
  <!-- Requerido por @capacitor-community/sqlite cuando corre en navegador
       (ng serve / build web) -- en Android/iOS nativo no se usa, el
       plugin habla directo con SQLite del SO. Sin este elemento, toda
       llamada a sqlite.* truena con "jeep-sqlite element is not present".

       autoSave="true" -- SIN esto, la base vive nada más en memoria
       (sql.js) y se pierde por completo al recargar la página; con
       autoSave cada INSERT/UPDATE/DELETE se guarda solo en IndexedDB
       (el "web store"), que sí sobrevive recargas. En Android/iOS
       nativo este atributo no aplica -- ahí SQLite ya persiste en disco
       de por sí. -->
  <jeep-sqlite autoSave="true"></jeep-sqlite>
</body>

</html>
