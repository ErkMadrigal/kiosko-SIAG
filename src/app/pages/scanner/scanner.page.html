<ion-content class="scanner-content" [fullscreen]="true">

  <!-- Video de fondo (cámara) -->
  <video #video autoplay muted playsinline class="camera-bg"></video>
  <canvas #canvas style="display:none"></canvas>

  <!-- Overlay oscuro -->
  <div class="scanner-overlay">

    <!-- Info empleado (top) -->
    <div class="emp-top-card" *ngIf="empleado">
      <div class="emp-av">{{ getInitials(empleado.nombreCompleto) }}</div>
      <div class="emp-info">
        <span class="emp-nombre">{{ empleado.nombreCompleto }}</span>
        <span class="emp-curp">{{ empleado.curp }}</span>
      </div>
      <div class="modo-chip" [class.entrada]="modo === 'entrada'" [class.salida]="modo === 'salida'">
        <ion-icon [name]="modo === 'entrada' ? 'log-in-outline' : 'log-out-outline'"></ion-icon>
        {{ modo === 'entrada' ? 'Entrada' : 'Salida' }}
      </div>
    </div>

    <!-- Óvalo scanner -->
    <div class="oval-container">

      <!-- SVG del óvalo con animación -->
      <svg class="oval-svg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradiente para el óvalo -->
          <linearGradient id="ovalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" [attr.stop-color]="colorOval" stop-opacity="1"/>
            <stop offset="100%" [attr.stop-color]="colorOvalEnd" stop-opacity="0.6"/>
          </linearGradient>
        </defs>

        <!-- Óvalo punteado de fondo -->
        <ellipse
          cx="150" cy="200" rx="110" ry="150"
          fill="none"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="2"
          stroke-dasharray="8 6"
        />

        <!-- Óvalo principal animado -->
        <ellipse
          cx="150" cy="200" rx="110" ry="150"
          fill="none"
          [attr.stroke]="colorOval"
          stroke-width="3"
          [class.oval-scanning]="estado === 'escaneando'"
          [class.oval-ok]="estado === 'ok'"
          [class.oval-fail]="estado === 'fail'"
          [class.oval-procesando]="estado === 'procesando'"
        />

        <!-- Línea de escaneo (solo cuando escanea) -->
        <line
          *ngIf="estado === 'escaneando' || estado === 'procesando'"
          x1="40" [attr.y1]="scanY"
          x2="260" [attr.y2]="scanY"
          [attr.stroke]="colorOval"
          stroke-width="1.5"
          stroke-opacity="0.8"
        />

        <!-- Ícono central resultado -->
        <text
          *ngIf="estado === 'ok' || estado === 'fail'"
          x="150" y="215"
          text-anchor="middle"
          dominant-baseline="middle"
          font-size="60"
          [attr.fill]="estado === 'ok' ? '#22c97a' : '#f05454'"
        >
          {{ estado === 'ok' ? '✓' : '✗' }}
        </text>

        <!-- Punto de escaneo en la parte inferior del óvalo -->
        <circle
          *ngIf="estado === 'escaneando'"
          cx="150" cy="350"
          r="4"
          [attr.fill]="colorOval"
          class="scan-dot"
        />
      </svg>

    </div>

    <!-- Mensaje de estado -->
    <div class="estado-info">
      <p class="estado-msg" [class.msg-ok]="estado === 'ok'" [class.msg-fail]="estado === 'fail'">
        {{ mensajeEstado }}
      </p>
      <p class="estado-sub" *ngIf="estado === 'escaneando'">RECONOCIMIENTO FACIAL</p>
      <p class="estado-sub" *ngIf="estado === 'procesando'">VERIFICANDO IDENTIDAD</p>
    </div>

    <!-- Botón cancelar -->
    <button class="btn-cancelar" (click)="cancelar()">
      Cancelar
    </button>

  </div>

</ion-content>
